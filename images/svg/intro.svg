<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Mohammed Belouarraq · Software Engineer · Cloud &amp; DevOps">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c9d1d9" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect x="0.5" y="0.5" width="1199" height="349" rx="14"/></clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    .rise { animation: rise 0.8s ease-out both; }
    .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.2s; } .d3 { animation-delay: 0.35s; }
    .d4 { animation-delay: 0.5s; } .d5 { animation-delay: 0.65s; } .d6 { animation-delay: 0.8s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* terminal: 14s loop */
    .screen { animation: screen 14s linear infinite; }
    @keyframes screen { 0%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .ln { animation: 14s linear infinite; }
    .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; }
    .l4 { animation-name: l4; } .l5 { animation-name: l5; } .l6 { animation-name: l6; } .l7 { animation-name: l7; }
    @keyframes l1 { 0%, 2% { opacity: 0; } 2.1%, 100% { opacity: 1; } }
    @keyframes l2 { 0%, 11% { opacity: 0; } 11.1%, 100% { opacity: 1; } }
    @keyframes l3 { 0%, 17% { opacity: 0; } 17.1%, 100% { opacity: 1; } }
    @keyframes l4 { 0%, 28% { opacity: 0; } 28.1%, 100% { opacity: 1; } }
    @keyframes l5 { 0%, 34% { opacity: 0; } 34.1%, 100% { opacity: 1; } }
    @keyframes l6 { 0%, 46% { opacity: 0; } 46.1%, 100% { opacity: 1; } }
    @keyframes l7 { 0%, 52% { opacity: 0; } 52.1%, 100% { opacity: 1; } }

    .cover { animation: 14s infinite; }
    .t1 { animation-name: t1; } .t2 { animation-name: t2; } .t3 { animation-name: t3; }
    @keyframes t1 { 0%, 3% { transform: translateX(0); animation-timing-function: steps(6); } 9%, 100% { transform: translateX(56px); } }
    @keyframes t2 { 0%, 18% { transform: translateX(0); animation-timing-function: steps(16); } 26%, 100% { transform: translateX(140px); } }
    @keyframes t3 { 0%, 35% { transform: translateX(0); animation-timing-function: steps(15); } 44%, 100% { transform: translateX(132px); } }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .pill rect { fill: #161b22; stroke: #30363d; }
    .pill text { fill: #c9d1d9; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="350" fill="#0d1117"/>
    <rect width="1200" height="350" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="349" rx="14" fill="none" stroke="#30363d"/>

  <!-- left: intro -->
  <g class="sans">
    <g class="rise d1">
      <rect x="72" y="62" width="3" height="18" rx="1.5" fill="#4493f8"/>
      <text x="86" y="76" class="mono" font-size="14" fill="#8b949e">Hi there, I'm</text>
    </g>
    <text class="rise d2" x="70" y="134" font-size="50" font-weight="700" fill="#f0f6fc" letter-spacing="-1.2">Mohammed Belouarraq</text>
    <text class="rise d3" x="72" y="174" font-size="22" font-weight="500" fill="#c9d1d9">Software Engineer <tspan fill="#484f58">/</tspan> Cloud &amp; DevOps</text>
    <text class="rise d4" x="72" y="206" font-size="15" fill="#8b949e">Casablanca, Morocco</text>

    <g class="mono" font-size="13" font-weight="500">
      <g class="rise d5">
        <g class="pill" transform="translate(72 236)"><rect width="76" height="28" rx="6"/><text x="38" y="18.5" text-anchor="middle">Python</text></g>
        <g class="pill" transform="translate(156 236)"><rect width="70" height="28" rx="6"/><text x="35" y="18.5" text-anchor="middle">C/C++</text></g>
        <g class="pill" transform="translate(234 236)"><rect width="60" height="28" rx="6"/><text x="30" y="18.5" text-anchor="middle">Java</text></g>
        <g class="pill" transform="translate(302 236)"><rect width="76" height="28" rx="6"/><text x="38" y="18.5" text-anchor="middle">Django</text></g>
        <g class="pill" transform="translate(386 236)"><rect width="100" height="28" rx="6"/><text x="50" y="18.5" text-anchor="middle">LLM Evals</text></g>
      </g>
      <g class="rise d6">
        <g class="pill" transform="translate(72 272)"><rect width="76" height="28" rx="6"/><text x="38" y="18.5" text-anchor="middle">Docker</text></g>
        <g class="pill" transform="translate(156 272)"><rect width="106" height="28" rx="6"/><text x="53" y="18.5" text-anchor="middle">Kubernetes</text></g>
        <g class="pill" transform="translate(270 272)"><rect width="98" height="28" rx="6"/><text x="49" y="18.5" text-anchor="middle">Terraform</text></g>
        <g class="pill" transform="translate(376 272)"><rect width="66" height="28" rx="6"/><text x="33" y="18.5" text-anchor="middle">CI/CD</text></g>
      </g>
    </g>
  </g>

  <!-- right: terminal -->
  <g transform="translate(745 46)">
    <rect width="410" height="262" rx="10" fill="#010409" stroke="#30363d"/>
    <path d="M10 0.5h390a9.5 9.5 0 0 1 9.5 9.5v26H0.5V10A9.5 9.5 0 0 1 10 0.5z" fill="#161b22"/>
    <circle cx="20" cy="18" r="5" fill="#484f58"/>
    <circle cx="37" cy="18" r="5" fill="#484f58"/>
    <circle cx="54" cy="18" r="5" fill="#484f58"/>
    <text x="205" y="22" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">bello@cloud: ~</text>
    <line x1="0.5" y1="36" x2="409.5" y2="36" stroke="#30363d"/>

    <g class="mono screen" font-size="14">
      <g class="ln l1">
        <text x="18" y="68"><tspan fill="#4493f8">$</tspan> <tspan fill="#e6edf3">whoami</tspan></text>
        <rect class="cover t1" x="34" y="54" width="150" height="20" fill="#010409"/>
      </g>
      <text class="ln l2" x="18" y="92" fill="#8b949e">software engineer, cloud &amp; devops</text>

      <g class="ln l3">
        <text x="18" y="124"><tspan fill="#4493f8">$</tspan> <tspan fill="#e6edf3">kubectl get pods</tspan></text>
        <rect class="cover t2" x="34" y="110" width="150" height="20" fill="#010409"/>
      </g>
      <text class="ln l4" x="18" y="148" fill="#8b949e">cloudpong-api   1/1   <tspan fill="#3fb950">Running</tspan>   0</text>

      <g class="ln l5">
        <text x="18" y="180"><tspan fill="#4493f8">$</tspan> <tspan fill="#e6edf3">terraform apply</tspan></text>
        <rect class="cover t3" x="34" y="166" width="150" height="20" fill="#010409"/>
      </g>
      <text class="ln l6" x="18" y="204" fill="#8b949e"><tspan fill="#3fb950">Apply complete!</tspan> Resources: 12 added.</text>

      <g class="ln l7">
        <text x="18" y="236"><tspan fill="#4493f8">$</tspan></text>
        <rect class="caret" x="34" y="223" width="8" height="16" fill="#c9d1d9"/>
      </g>
    </g>
  </g>
</svg>
