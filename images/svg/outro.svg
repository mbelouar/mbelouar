<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Thanks for stopping by">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="#30363d"/>
  <text x="600" y="60" text-anchor="middle" font-size="14" fill="#8b949e"><tspan fill="#4493f8">$</tspan> echo "thanks for stopping by"</text>
  <rect class="caret" x="737" y="47" width="8" height="16" fill="#8b949e"/>
</svg>
